<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Aliases so the cheatsheet SVG's font-family names resolve to the
  fonts actually installed on this machine. The GUST Latin Modern OTFs
  register under names like "LMSans10" / "LMSansDemiCond10", but the
  SVG (authored on a system with Debian's fonts-lmodern aliases) asks
  for "Latin Modern Sans" / "Latin Modern Sans Demi Cond".

  Install: copy into Inkscape's fontconfig conf.d, e.g.
    .../Inkscape.app/Contents/Resources/etc/fonts/conf.d/
  and into the system fontconfig conf.d for non-Inkscape tools.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Latin Modern Sans Demi Cond</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>LMSansDemiCond10</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Latin Modern Sans</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>LMSans10</string>
    </edit>
  </match>
</fontconfig>
